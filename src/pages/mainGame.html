<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../css/game.css">
        <title>FLEE THE FLAMES </title>
    </head>
    <body>
    <div style="position: relative;">
        <canvas id="gameCanvas" width="1536" height="864"></canvas>
        <div id="pauseScreen" style="display: none;">
            <h1>Game Paused</h1>
            <button id="resumeButton">Resume</button>
            <button id="settingsButton">Settings</button>
        </div>
        <div id="settingsScreen" style="display: none;">
            <h1>Settings</h1>
            <div id="musicVolumeContainer">
                <label for="musicVolume">Music Volume:</label>
                <input type="range" id="musicVolume" min="0" max="1" step="0.01">
            </div>
            <div id="soundVolumeContainer">
                <label for="soundVolume">Sound Volume:</label>
                <input type="range" id="soundVolume" min="0" max="1" step="0.01">
            </div>
            <button id="backButton">Back</button>
        </div>
    </div>
        <script src="../js/main.js" type="module"></script>
        <!-- <script src="../js/rock.js"></script> -->
    </body>
</html>
